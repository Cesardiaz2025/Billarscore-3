<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Score Billar POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fija con pestañas; marcador estilo transmisión con colores configurables; resto en paneles oscuros. */
:root{
  --bg:#0a111f; --panel:#111c30; --panel2:#17263f; --line:#25365a;
  --fg:#e9effc; --mut:#8ea0c2; --blue:#1d5cc0;
  --gold:#f2c40d; --ink:#0a0f1a; --ok:#34d27b; --warn:#ffb020; --bad:#ff5a4d;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--f-body);margin:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:80}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:16px;padding-block:8px;flex-wrap:wrap}
.brand{font:800 26px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--gold);font-weight:800}
nav.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1}
nav.tabs a{color:var(--mut);text-decoration:none;font:600 17px/1 var(--f-disp);letter-spacing:.05em;text-transform:uppercase;padding:11px 13px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a.on{color:var(--fg);border-bottom-color:var(--gold)}
.pulse{display:flex;gap:14px;font-size:13px;color:var(--mut);white-space:nowrap}
.pulse b{color:var(--fg);font-weight:600}
#lang{width:auto;min-height:34px;padding:4px 8px;font-size:14px}
main{padding-block:20px 80px}
h2{font:700 28px/1.1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
h3{font:700 19px/1.1 var(--f-disp);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.lead{color:var(--mut);margin:0 0 18px;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn:hover{border-color:#3a5390;background:#1c2f4f}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.pri:hover{background:#ffd633}
.btn.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.dng{color:var(--bad)}
.btn.dng.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 9px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.big{min-height:64px;font:800 26px/1 var(--f-disp);letter-spacing:.05em;text-transform:uppercase}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
input,select{background:#0b1526;border:1px solid var(--line);border-radius:4px;padding:9px 10px;min-height:38px;width:100%;font-size:15px;color:var(--fg);text-transform:none;letter-spacing:0;font-weight:400}
input[type=checkbox]{width:auto;min-height:0}
input[type=color]{padding:2px;min-height:38px;cursor:pointer}
input[type=range]{padding:0;min-height:24px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.chip:hover,.chip.on{border-color:var(--gold)}
.chip small{display:block;color:var(--mut);font-size:11px}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.sw{width:30px;height:30px;border-radius:4px;border:2px solid var(--line);cursor:pointer;padding:0}
.pill{display:inline-block;font:700 12px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--panel2);color:var(--mut)}
.pill.free{color:var(--ok);background:rgba(52,210,123,.12)}
.pill.busy{color:var(--ink);background:var(--gold)}
.pill.paused,.pill.low{color:var(--warn);background:rgba(255,176,32,.14)}
.pill.out{color:var(--bad);background:rgba(255,90,77,.14)}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:700 13px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;background:var(--panel);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
td input{min-height:32px;padding:4px 8px}
.demo{background:rgba(242,196,13,.1);border:1px solid rgba(242,196,13,.4);border-radius:6px;padding:10px 14px;margin-bottom:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{border-left:3px solid var(--blue);padding:2px 0 2px 12px}
.kpi span{display:block;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.kpi b{font:700 28px/1.15 var(--f-disp);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.bar i{display:block;height:14px;background:var(--blue);border-radius:2px;min-width:2px}
.bar.g i{background:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--ink);padding:10px 16px;border-radius:4px;font-weight:600;z-index:300;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.subctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--mut)}
.kbd{font:600 11px var(--f-body);border:1px solid var(--line);border-radius:3px;padding:1px 5px;background:var(--panel2)}
/* avatares */
.av{width:1em;height:1em;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;flex:none;font:800 .55em/1 var(--f-disp);color:#000;background:#ccc}
.em{height:1em;max-width:1.6em;object-fit:contain;flex:none}
/* ---------- marcador ---------- */
#livewrap{display:flex;flex-direction:column;gap:14px}
#livewrap.live{position:fixed;inset:0;z-index:150;background:#000;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.board{--bgc:#1d5cc0;--num:#fff;position:relative;container-type:inline-size;aspect-ratio:16/9;width:100%;background:var(--bgc);border-radius:6px;overflow:hidden;border:1px solid color-mix(in srgb,var(--bgc) 70%,white)}
#livewrap.live .board{width:min(100%,calc((100vh - 130px) * 16 / 9));border-radius:0}
.binner{position:absolute;inset:0;display:grid;grid-template-rows:15fr 56fr 13fr 6fr;gap:.5cqw;padding:.4cqw;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--bgc) 78%,white) 0,var(--bgc) 45%,color-mix(in srgb,var(--bgc) 55%,black) 100%)}
.bnames{display:grid;grid-template-columns:1fr 1fr;gap:.5cqw}
.bn{display:flex;align-items:center;justify-content:center;gap:1.2cqw;font:800 5.8cqw/1 var(--f-disp);text-transform:uppercase;overflow:hidden;white-space:nowrap;padding:0 1.2cqw}
.bn .bt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.bn .av{font-size:7cqw}
.bn .em{font-size:6cqw}
.win{box-shadow:inset 0 0 0 .6cqw #34d27b}
.bmid{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;background:rgba(255,255,255,.07)}
.pts{font:800 29cqw/1 var(--f-disp);text-align:center;color:var(--num);font-variant-numeric:tabular-nums;text-shadow:0 .5cqw 1cqw rgba(0,0,0,.25)}
.pts.sm{font-size:21cqw}
.inn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--bgc) 55%,black);border:.2cqw solid color-mix(in srgb,var(--bgc) 35%,black);padding:.9cqw 5.2cqw;font:600 5.6cqw/1 var(--f-disp);color:#d3dcf2;text-align:center;min-width:16cqw}
.bstats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:.5cqw}
.bs{display:flex;align-items:center;justify-content:center;gap:1.4cqw;background:color-mix(in srgb,var(--bgc) 50%,black);font:600 6cqw/1 var(--f-disp);color:#fff;font-variant-numeric:tabular-nums}
.ball{width:4.6cqw;height:4.6cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8d4c4 55%,#8a8777);display:inline-block}
.ball.y{background:radial-gradient(circle at 35% 30%,#fff7a8,#f2c40d 55%,#8a6d00)}
.bbar{display:grid;grid-template-columns:repeat(40,1fr);gap:.15cqw;background:#000}
.bbar i{display:block}
.bbar.up{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
/* varios jugadores */
.mtop{display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 2cqw;background:rgba(255,255,255,.08);font:700 4.6cqw/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:#fff}
.mgrid{display:grid;gap:.6cqw;min-height:0}
.mgrid.m3{grid-template-columns:repeat(3,1fr)}
.mgrid.m4{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr}
.mgrid.m5,.mgrid.m6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.pc{display:grid;grid-template-rows:auto 1fr auto;background:rgba(255,255,255,.08);min-width:0;min-height:0;overflow:hidden}
.pc.act{box-shadow:inset 0 0 0 .5cqw var(--gold)}
.pn{display:flex;align-items:center;justify-content:center;gap:1cqw;font:800 3.6cqw/1.3 var(--f-disp);text-transform:uppercase;white-space:nowrap;padding:.4cqw 1cqw;overflow:hidden}
.pn .bt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pn .av{font-size:4.4cqw}.pn .em{font-size:3.8cqw}
.pp{display:flex;align-items:center;justify-content:center;font:800 16cqw/1 var(--f-disp);color:var(--num);font-variant-numeric:tabular-nums;min-height:0}
.m4 .pp{font-size:12cqw}.m5 .pp,.m6 .pp{font-size:11cqw}
.m4 .pn,.m5 .pn,.m6 .pn{font-size:2.9cqw}.m4 .pn .av,.m5 .pn .av,.m6 .pn .av{font-size:3.4cqw}
.pf{display:flex;justify-content:space-between;align-items:center;padding:.3cqw 1.4cqw;font:600 4cqw/1.2 var(--f-disp);color:#fff;background:color-mix(in srgb,var(--bgc) 50%,black);font-variant-numeric:tabular-nums}
.m4 .pf,.m5 .pf,.m6 .pf{font-size:3cqw}
.pf .ball{width:3cqw;height:3cqw;margin-right:.6cqw}
.controls{display:grid;grid-template-columns:2fr 1.3fr;gap:12px}
#livewrap.live .controls{width:min(100%,900px)}
.announce{min-height:26px;font:700 20px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.sheet{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.sheet table{font-size:13px}
.sheet th,.sheet td{text-align:center;padding:6px 9px}
.sheet th:first-child,.sheet td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
.sheet td small{color:var(--mut);display:block;font-size:11px}
.sheet td.cur{background:rgba(242,196,13,.12)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 18px;margin-bottom:14px}
.stats div span{display:block;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.stats div b{font:700 24px/1.2 var(--f-disp);font-variant-numeric:tabular-nums}
.who{display:inline-flex;align-items:center;gap:8px}
.who .av{font-size:26px}
.pcard{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px}
.pcard .av{font-size:64px;flex:none}
.pcard .em{font-size:30px}
.pcard .fl{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
/* trofeo */
#trophy{position:fixed;inset:0;z-index:250;display:grid;place-items:center;background:rgba(3,8,18,.82)}
#trophy canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tcard2{position:relative;text-align:center;padding:24px 28px;max-width:min(92vw,460px)}
.tcard2 svg{width:min(52vw,230px);height:auto;animation:rise .9s cubic-bezier(.2,1.3,.4,1) both,bob 2.6s ease-in-out .9s infinite}
@keyframes rise{from{transform:translateY(60px) scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
.tcard2 h2{font-size:44px;color:var(--gold);margin-top:6px}
.tcard2 .nm{font:800 38px/1.1 var(--f-disp);text-transform:uppercase;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.tcard2 .nm .av{font-size:56px}
.shine{animation:shine 2.2s ease-in-out infinite}
@keyframes shine{50%{opacity:.25}}
/* mesas */
.mesas{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.mesas{grid-template-columns:minmax(0,1fr)}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px}
.tcard:hover{border-color:#3a5390}
.tcard.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.tcard .nm{font:700 22px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.tcard .tm{font:600 30px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.tcard.busy .tm{color:var(--gold)}
.tcard .meta{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.tcard>span:first-child{flex-wrap:wrap}
.timer{font:700 54px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.line .q{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.sum .tot{font:700 30px/1 var(--f-disp);color:var(--gold)}
.pgrid{display:flex;gap:6px;flex-wrap:wrap;max-height:210px;overflow-y:auto}
/* cámaras */
.cams{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.cams{grid-template-columns:minmax(0,1fr)}}
.clist{display:flex;flex-direction:column;gap:8px}
.clist .tcard{min-height:0;flex-direction:row;justify-content:space-between;align-items:center}
.zwrap{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:6px;cursor:grab;touch-action:none}
.zwrap:active{cursor:grabbing}
.zin{position:absolute;inset:0;transform-origin:50% 50%}
.zin video,.zin canvas{width:100%;height:100%;object-fit:contain;display:block}
.zhud{position:absolute;left:10px;top:10px;font:700 14px/1 var(--f-disp);letter-spacing:.1em;padding:5px 8px;border-radius:3px;background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.zhud.rp{background:var(--gold);color:#000}
.zempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mut)}
/* admin / reglamento */
details.acc{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
details.acc summary{cursor:pointer;padding:13px 16px;font:700 20px/1.2 var(--f-disp);letter-spacing:.05em;text-transform:uppercase;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";float:right;color:var(--gold)}
details.acc[open] summary::after{content:"–"}
details.acc .bd{padding:2px 18px 16px;max-width:80ch}
details.acc li{margin:6px 0}
.gl dt{font-weight:600;margin-top:10px}
.gl dd{margin:0;color:var(--mut)}
textarea.cierre{width:100%;min-height:150px;background:#0b1526;border:1px solid var(--line);border-radius:4px;padding:10px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);resize:vertical}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pin{max-width:340px;margin:40px auto;text-align:center}
.pin input{text-align:center;font:700 28px var(--f-disp);letter-spacing:.4em}
@media(max-width:560px){.controls{grid-template-columns:1fr}.pulse{display:none}.timer{font-size:44px}}
@media(max-width:1020px){.pulse{display:none}}
#ticket{position:fixed;inset:0;z-index:260;display:flex;background:rgba(3,8,18,.88);overflow-y:auto;padding:18px 16px}
.paper{background:#fbfaf5;color:#16181d;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;width:min(100%,380px);padding:22px 18px;border-radius:2px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.paper .c{text-align:center}.paper .big{font:800 26px/1.2 var(--f-disp);letter-spacing:.12em;margin-bottom:2px}
.paper .sep{border-top:1px dashed #8a8d96;margin:9px 0}
.paper .row{display:flex;justify-content:space-between;gap:12px}.paper .row span:first-child{min-width:0;overflow-wrap:anywhere}
.paper .b{font-weight:700}
#radio{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#radio>.btn{background:var(--panel);box-shadow:0 4px 18px rgba(0,0,0,.5)}
.radio-p{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;width:min(270px,calc(100vw - 32px));box-shadow:0 8px 28px rgba(0,0,0,.55)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap row">
    <div class="brand">Score <b>Billar</b></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="pulse" id="pulse"></div>
    <select id="lang" aria-label="Language"></select>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<div id="trophy" hidden></div>
<div id="ticket" hidden></div>
<div id="radio"></div>

<script>
(function(){
'use strict';
/* ---------- idiomas ---------- */
var LANGS=[['es','Español','es-CO'],['en','English','en-US'],['fr','Français','fr-FR'],['it','Italiano','it-IT'],['pt','Português','pt-BR'],['de','Deutsch','de-DE'],['vi','Tiếng Việt','vi-VN'],['ko','한국어','ko-KR']];

d('ru.lead',['Resumen de los documentos del archivo: normas de arbitraje de la UMB, reglamento de arbitraje y disciplina de la CPB y notas de la A.U.B. / Federación Colombiana de Billar. Para decisiones oficiales, consulta el texto completo.','Summary of the documents in the archive: UMB refereeing rules, CPB refereeing and discipline rules and A.U.B. / Colombian Billiards Federation notes. For official decisions, consult the full text.','Résumé des documents : règles d’arbitrage UMB, règlement d’arbitrage et de discipline CPB et notes A.U.B. / Fédération colombienne. Pour les décisions officielles, consultez le texte complet.','Riepilogo dei documenti: norme arbitrali UMB, regolamento arbitrale e disciplinare CPB e note A.U.B. / Federazione colombiana. Per decisioni ufficiali consulta il testo completo.','Resumo dos documentos: normas de arbitragem da UMB, regulamento de arbitragem e disciplina da CPB e notas da A.U.B. / Federação Colombiana. Para decisões oficiais, consulte o texto completo.','Zusammenfassung der Dokumente: UMB-Schiedsrichterregeln, CPB-Regeln zu Schiedsrichtern und Disziplin und Notizen der A.U.B. / Kolumbianischer Billardverband. Für offizielle Entscheidungen den Volltext lesen.','Tóm tắt các tài liệu: quy tắc trọng tài UMB, quy định trọng tài và kỷ luật CPB và ghi chú A.U.B. / Liên đoàn Bi-a Colombia. Với quyết định chính thức, hãy xem bản đầy đủ.','자료 요약: UMB 심판 규정, CPB 심판·징계 규정, A.U.B./콜롬비아 당구연맹 노트. 공식 결정은 전문을 확인하세요.']);

d('ru.1b',['Superficie de juego de 284 × 142 cm.|Bandas de caucho de 37 mm de altura.|Diamantes cada 1/8 de la longitud de juego.|Bolas esféricas, limpias solo con alcohol.|El árbitro revisa mesa, paño, bolas e iluminación antes de empezar.','Playing surface of 284 × 142 cm.|Rubber cushions 37 mm high.|Diamonds every 1/8 of the playing length.|Spherical balls, cleaned only with alcohol.|The referee checks table, cloth, balls and lighting before the match.','Surface de jeu de 284 × 142 cm.|Bandes en caoutchouc de 37 mm de hauteur.|Losanges tous les 1/8 de la longueur de jeu.|Billes sphériques, nettoyées uniquement à l’alcool.|L’arbitre contrôle table, tapis, billes et éclairage avant la partie.','Piano di gioco di 284 × 142 cm.|Sponde in gomma alte 37 mm.|Diamanti ogni 1/8 della lunghezza di gioco.|Bilie sferiche, pulite solo con alcol.|L’arbitro controlla tavolo, panno, bilie e illuminazione prima di iniziare.','Superfície de jogo de 284 × 142 cm.|Tabelas de borracha com 37 mm de altura.|Diamantes a cada 1/8 do comprimento de jogo.|Bolas esféricas, limpas só com álcool.|O árbitro verifica mesa, pano, bolas e iluminação antes de começar.','Spielfläche 284 × 142 cm.|Gummibanden 37 mm hoch.|Diamanten alle 1/8 der Spiellänge.|Kugeln kugelrund, nur mit Alkohol gereinigt.|Der Schiedsrichter prüft Tisch, Tuch, Kugeln und Beleuchtung vor dem Spiel.','Mặt bàn 284 × 142 cm.|Băng cao su cao 37 mm.|Chấm kim cương mỗi 1/8 chiều dài mặt bàn.|Bi tròn, chỉ lau bằng cồn.|Trọng tài kiểm tra bàn, nỉ, bi và ánh sáng trước trận.','플레이 면 284 × 142 cm.|고무 쿠션 높이 37 mm.|다이아몬드는 경기장 길이의 1/8 간격.|공은 완전한 구형이며 알코올로만 닦습니다.|심판은 경기 전 테이블, 천, 공, 조명을 점검합니다.']);
d('ru.2',['Dirección de la partida','Running the match','Conduite de la partie','Direzione della partita','Direção da partida','Spielleitung','Điều hành trận đấu','경기 진행']);
d('ru.2b',['Solo el árbitro dirige la partida, desde el llamado a los jugadores hasta entregar la planilla firmada.|Un segundo árbitro o anotador lleva la planilla y el reloj.|En partidas de más de una hora se recomienda cambiar de árbitro, solo al cambiar de jugador.','Only the referee runs the match, from calling the players until handing in the signed score sheet.|A second referee or scorer keeps the sheet and the clock.|In matches over an hour, changing referee is recommended, only when the player changes.','Seul l’arbitre dirige la partie, de l’appel des joueurs à la remise de la feuille signée.|Un second arbitre ou marqueur tient la feuille et le chrono.|Au-delà d’une heure, on conseille de changer d’arbitre, uniquement au changement de joueur.','Solo l’arbitro dirige la partita, dalla chiamata dei giocatori alla consegna del referto firmato.|Un secondo arbitro o segnapunti tiene referto e orologio.|Oltre un’ora si consiglia di cambiare arbitro, solo al cambio giocatore.','Só o árbitro dirige a partida, da chamada dos jogadores até entregar a súmula assinada.|Um segundo árbitro ou anotador cuida da súmula e do relógio.|Em partidas de mais de uma hora recomenda-se trocar de árbitro, só na troca de jogador.','Nur der Schiedsrichter leitet das Spiel, vom Aufruf der Spieler bis zur Abgabe des unterschriebenen Spielbogens.|Ein zweiter Schiedsrichter oder Schreiber führt Bogen und Uhr.|Bei Spielen über eine Stunde wird ein Wechsel empfohlen, nur beim Spielerwechsel.','Chỉ trọng tài điều hành trận, từ lúc gọi người chơi đến khi nộp phiếu điểm có chữ ký.|Trọng tài phụ hoặc ghi điểm giữ phiếu và đồng hồ.|Trận trên một giờ nên đổi trọng tài, chỉ khi đổi người chơi.','경기는 심판만 진행하며, 선수 호출부터 서명된 기록지 제출까지 맡습니다.|제2심판이나 기록원이 기록지와 시계를 관리합니다.|1시간이 넘는 경기는 선수 교대 시점에만 심판을 교체하길 권합니다.']);
d('ru.3',['Protocolo y anuncios','Protocol and calls','Protocole et annonces','Protocollo e annunci','Protocolo e anúncios','Ablauf und Ansagen','Quy trình và thông báo','진행 절차와 콜']);
d('ru.3b',['Calentamiento de tres a cinco minutos; el juez coloca las bolas de salida.|Anuncia los puntos con el apellido (cero si falla) y al final de cada entrada.|Avisos «pour cinq, quatre, trois, deux» en los últimos puntos; en tres bandas solo los tres últimos.|Al final: punto de partida y fin de la partida; todos firman la planilla.','Three to five minutes of warm-up; the referee sets the starting balls.|Calls the points with the surname (zero on a miss) and at the end of each inning.|Calls «pour cinq, quatre, trois, deux» for the last points; in three-cushion only the last three.|At the end: match point and end of match; everyone signs the sheet.','Échauffement de trois à cinq minutes ; l’arbitre place les billes de départ.|Il annonce les points avec le nom (zéro en cas d’échec) et en fin de reprise.|Annonces « pour cinq, quatre, trois, deux » sur les derniers points ; au trois bandes, les trois derniers.|À la fin : point de partie et fin de partie ; tous signent la feuille.','Riscaldamento da tre a cinque minuti; l’arbitro dispone le bilie di partenza.|Annuncia i punti con il cognome (zero se sbaglia) e a fine ripresa.|Annunci «pour cinq, quatre, trois, deux» negli ultimi punti; nel tre sponde solo gli ultimi tre.|Alla fine: punto partita e fine partita; tutti firmano il referto.','Aquecimento de três a cinco minutos; o árbitro coloca as bolas de saída.|Anuncia os pontos com o sobrenome (zero se falhar) e no fim de cada entrada.|Avisos «pour cinq, quatre, trois, deux» nos últimos pontos; em três bandas só os três últimos.|No fim: ponto de partida e fim da partida; todos assinam a súmula.','Drei bis fünf Minuten Einspielen; der Schiedsrichter legt die Startkugeln.|Er sagt Punkte mit Nachnamen an (null bei Fehler) und am Ende jeder Aufnahme.|Ansagen «pour cinq, quatre, trois, deux» bei den letzten Punkten; beim Dreiband nur die letzten drei.|Am Ende: Matchpunkt und Spielende; alle unterschreiben den Bogen.','Khởi động ba đến năm phút; trọng tài đặt bi xuất phát.|Xướng điểm kèm họ (không điểm nếu hỏng) và cuối mỗi lượt.|Báo «pour cinq, quatre, trois, deux» ở các điểm cuối; bi-a 3 băng chỉ ba điểm cuối.|Cuối trận: điểm quyết định và hết trận; mọi người ký phiếu.','워밍업 3~5분; 심판이 시작 공을 놓습니다.|득점은 성(姓)과 함께 콜하고(실패 시 제로), 이닝이 끝날 때도 콜합니다.|마지막 득점에서 «pour cinq, quatre, trois, deux» 콜; 쓰리쿠션은 마지막 3점만.|종료 시 매치 포인트와 경기 종료를 알리고 모두 기록지에 서명합니다.']);
d('ru.4',['Árbitro y anotador','Referee and scorer','Arbitre et marqueur','Arbitro e segnapunti','Árbitro e anotador','Schiedsrichter und Schreiber','Trọng tài và người ghi điểm','심판과 기록원']);
d('ru.4b',['El árbitro no muestra sentimientos ni avisa de errores antes de que ocurran; sus fallos son inapelables.|No fuma ni bebe alcohol; debe ser mayor de 21 años y estar avalado por la asociación.|El anotador se sienta junto a la mesa, confirma los anuncios y anota hora de inicio y fin.','The referee shows no emotion and does not warn of errors before they happen; decisions are final.|No smoking or alcohol; must be over 21 and certified by the association.|The scorer sits beside the table, confirms the calls and logs start and end times.','L’arbitre ne montre aucune émotion et n’avertit pas des erreurs avant qu’elles ne se produisent ; ses décisions sont sans appel.|Ni tabac ni alcool ; plus de 21 ans et agréé par l’association.|Le marqueur s’assied près de la table, confirme les annonces et note les heures de début et de fin.','L’arbitro non mostra emozioni né avvisa degli errori prima che accadano; le sue decisioni sono inappellabili.|Niente fumo né alcol; maggiore di 21 anni e abilitato dall’associazione.|Il segnapunti siede accanto al tavolo, conferma gli annunci e annota ora di inizio e fine.','O árbitro não demonstra emoções nem avisa de erros antes de acontecerem; suas decisões são inapeláveis.|Não fuma nem bebe álcool; deve ter mais de 21 anos e ser credenciado pela associação.|O anotador senta ao lado da mesa, confirma os anúncios e anota horário de início e fim.','Der Schiedsrichter zeigt keine Gefühle und warnt nicht vor Fehlern; seine Entscheidungen sind endgültig.|Kein Rauchen oder Alkohol; über 21 Jahre und vom Verband zugelassen.|Der Schreiber sitzt am Tisch, bestätigt Ansagen und notiert Start- und Endzeit.','Trọng tài không bộc lộ cảm xúc, không nhắc lỗi trước khi xảy ra; quyết định là cuối cùng.|Không hút thuốc, không uống rượu; trên 21 tuổi và được hiệp hội công nhận.|Người ghi điểm ngồi cạnh bàn, xác nhận thông báo và ghi giờ bắt đầu, kết thúc.','심판은 감정을 드러내지 않으며 실수 전에 경고하지 않고, 판정은 최종입니다.|흡연·음주 금지, 21세 이상이며 협회 인증이 필요합니다.|기록원은 테이블 옆에 앉아 콜을 확인하고 시작·종료 시간을 기록합니다.']);
d('ru.5',['Disciplina','Discipline','Discipline','Disciplina','Disciplina','Disziplin','Kỷ luật','징계']);
d('ru.5b',['Prohibido comer, fumar y consumir alcohol en la sala.|Tres llamadas de atención en una partida la hacen perder; una falta grave puede sacar del evento.|El público no habla a jugadores ni árbitros y mantiene el celular en silencio.|Retraso máximo de diez minutos tras la primera llamada, o se pierde por default.|Quien deja la mesa sin permiso, o más de cinco minutos con permiso, pierde ese juego.','No eating, smoking or alcohol in the playing hall.|Three warnings in a match lose it; a serious offense can remove a player from the event.|The audience does not speak to players or officials and keeps phones silent.|Maximum ten minutes late after the first call, or the match is lost by default.|Leaving the table without permission, or for over five minutes with permission, loses that game.','Interdit de manger, fumer ou consommer de l’alcool dans la salle.|Trois avertissements dans une partie la font perdre ; une faute grave peut exclure de l’événement.|Le public ne parle pas aux joueurs ni aux officiels et met son téléphone en silencieux.|Retard maximal de dix minutes après le premier appel, sinon défaite par forfait.|Quitter la table sans permission, ou plus de cinq minutes avec permission, fait perdre cette manche.','Vietato mangiare, fumare e consumare alcol in sala.|Tre richiami in una partita la fanno perdere; una colpa grave può escludere dall’evento.|Il pubblico non parla a giocatori o ufficiali e tiene il telefono silenzioso.|Ritardo massimo di dieci minuti dopo la prima chiamata, altrimenti sconfitta a tavolino.|Lasciare il tavolo senza permesso, o oltre cinque minuti con permesso, fa perdere quel gioco.','Proibido comer, fumar e consumir álcool na sala.|Três advertências numa partida fazem perdê-la; falta grave pode excluir do evento.|O público não fala com jogadores nem árbitros e mantém o celular no silencioso.|Atraso máximo de dez minutos após a primeira chamada, ou perde por W.O.|Sair da mesa sem permissão, ou mais de cinco minutos com permissão, perde aquele jogo.','Essen, Rauchen und Alkohol im Spielsaal verboten.|Drei Verwarnungen in einem Spiel bedeuten Verlust; ein schwerer Verstoß kann den Ausschluss bedeuten.|Das Publikum spricht nicht mit Spielern oder Offiziellen und stellt Handys lautlos.|Höchstens zehn Minuten Verspätung nach dem ersten Aufruf, sonst Niederlage durch Nichtantreten.|Wer den Tisch ohne Erlaubnis verlässt, oder mit Erlaubnis länger als fünf Minuten, verliert das Spiel.','Cấm ăn, hút thuốc và dùng rượu trong phòng thi đấu.|Ba lần nhắc nhở trong một trận sẽ bị xử thua; lỗi nặng có thể bị loại khỏi giải.|Khán giả không nói chuyện với người chơi hay trọng tài và để điện thoại im lặng.|Trễ tối đa mười phút sau lần gọi đầu, nếu không bị xử thua.|Rời bàn không phép, hoặc quá năm phút dù có phép, sẽ thua ván đó.','경기장에서 음식, 흡연, 음주는 금지입니다.|한 경기에서 경고 3회면 패배하며, 중대한 반칙은 대회에서 퇴장될 수 있습니다.|관중은 선수·심판과 대화하지 않고 휴대폰을 무음으로 둡니다.|첫 호출 후 최대 10분 지각까지 허용되며, 넘으면 부전패입니다.|허락 없이 테이블을 떠나거나 허락받고도 5분을 넘기면 해당 게임을 잃습니다.']);
d('ru.6',['Casos no previstos','Unforeseen cases','Cas imprévus','Casi non previsti','Casos omissos','Nicht geregelte Fälle','Trường hợp chưa quy định','규정에 없는 경우']);
d('ru.6b',['Los casos no previstos o de fuerza mayor los resuelve la dirección deportiva o el comité técnico; en torneos UMB, su delegado oficial.','Unforeseen cases or force majeure are decided by the sports direction or technical committee; in UMB events, by its official delegate.','Les cas imprévus ou de force majeure sont tranchés par la direction sportive ou le comité technique ; en tournoi UMB, par son délégué officiel.','I casi non previsti o di forza maggiore sono risolti dalla direzione sportiva o dal comitato tecnico; nei tornei UMB dal suo delegato ufficiale.','Os casos omissos ou de força maior são resolvidos pela direção esportiva ou comitê técnico; em torneios UMB, pelo delegado oficial.','Nicht geregelte Fälle oder höhere Gewalt entscheidet die Sportleitung oder das technische Komitee; bei UMB-Turnieren deren offizieller Delegierter.','Trường hợp chưa quy định hoặc bất khả kháng do ban thể thao hoặc ủy ban kỹ thuật quyết định; giải UMB do đại biểu chính thức.','규정에 없는 경우나 불가항력은 경기 위원회 또는 기술위원회가, UMB 대회는 공식 대표가 결정합니다.']);
d('gl.title',['Glosario del marcador','Scoreboard glossary','Glossaire du tableau','Glossario del tabellone','Glossário do placar','Glossar der Anzeige','Thuật ngữ bảng điểm','점수판 용어']);
d('gl.1',['Entrada: turno de un jugador. La entrada N termina cuando todos la han jugado.','Inning: a player’s turn. Inning N ends when everyone has played it.','Reprise : tour d’un joueur. La reprise N finit quand tous l’ont jouée.','Ripresa: turno di un giocatore. La ripresa N termina quando tutti l’hanno giocata.','Entrada: vez de um jogador. A entrada N termina quando todos jogaram.','Aufnahme: Turn eines Spielers. Aufnahme N endet, wenn alle gespielt haben.','Lượt: phiên đánh của một người. Lượt N kết thúc khi mọi người đã đánh.','이닝: 선수의 차례. N번째 이닝은 모두가 친 뒤 끝납니다.']);
d('gl.2',['Serie: carambolas seguidas dentro de una entrada.','Run: consecutive points within one inning.','Série : points consécutifs dans une reprise.','Serie: punti consecutivi in una ripresa.','Série: pontos seguidos numa entrada.','Serie: aufeinanderfolgende Punkte in einer Aufnahme.','Chuỗi: các điểm liên tiếp trong một lượt.','연속 득점: 한 이닝 안의 연속된 득점.']);
d('gl.3',['Promedio: puntos del jugador entre las entradas jugadas.','Average: player’s points divided by innings played.','Moyenne : points du joueur divisés par les reprises jouées.','Media: punti del giocatore divisi per le riprese giocate.','Média: pontos do jogador divididos pelas entradas jogadas.','Schnitt: Punkte des Spielers geteilt durch gespielte Aufnahmen.','Trung bình: điểm của người chơi chia cho số lượt đã đánh.','평균: 선수 득점을 진행된 이닝 수로 나눈 값.']);
d('gl.4',['Igualada: si alguien llega a la meta, los que faltan en esa entrada juegan para igualar.','Equalizing turn: if someone reaches the goal, the players still to play in that inning get their turn.','Égalisation : si quelqu’un atteint l’objectif, ceux qui restent à jouer dans la reprise ont leur tour.','Parità: se qualcuno raggiunge l’obiettivo, chi deve ancora giocare nella ripresa ha il suo turno.','Igualdade: se alguém atinge a meta, os que faltam jogar na entrada têm a sua vez.','Ausgleich: Erreicht jemand das Ziel, kommen die restlichen Spieler der Aufnahme noch dran.','Lượt gỡ: nếu ai đạt mục tiêu, những người chưa đánh trong lượt đó vẫn được đánh.','동점 이닝: 누군가 목표에 도달하면 그 이닝에서 남은 선수들이 차례를 갖습니다.']);
d('gl.5',['Tiempo de tiro: segundos disponibles para cada tiro; la barra de colores muestra cuánto queda.','Shot clock: seconds available for each shot; the color bar shows what is left.','Temps de coup : secondes disponibles par coup ; la barre de couleurs montre le temps restant.','Tempo di tiro: secondi disponibili per ogni tiro; la barra colorata mostra quanto resta.','Tempo da tacada: segundos disponíveis por tacada; a barra colorida mostra o que resta.','Schusszeit: Sekunden pro Stoß; der Farbbalken zeigt die Restzeit.','Giờ cú đánh: số giây cho mỗi cú; thanh màu cho biết thời gian còn lại.','샷 시계: 샷마다 주어진 시간(초); 색 막대가 남은 시간을 보여줍니다.']);

d('cm.title',['Cámaras por mesa','Table cameras','Caméras par table','Telecamere per tavolo','Câmeras por mesa','Kameras pro Tisch','Camera từng bàn','테이블별 카메라']);

function payTable(){
  var T=getT(selT),c=calcT(T);
  if(!T.items.length&&c.timeCharge===0){toast(t('tb.empty'));return}
  if(T.method==='cash'&&T.received!==''&&+T.received<c.total){toast(t('tb.notenough'));return}
  T.items.forEach(function(it){var p=S.products.find(function(x){return x.id===it.pid});if(p&&p.track)p.stock=Math.max(0,p.stock-it.qty)});
  S.sales.unshift({id:uid(),ts:Date.now(),table:tname(T),timeMs:c.ms,timeCharge:c.timeCharge,items:T.items.map(function(i){return {pid:i.pid,name:i.name,price:i.price,cost:i.cost,qty:i.qty}}),itemsTotal:c.items,discount:c.disc,total:c.total,method:T.method});
  var keep={name:T.name,num:T.num};Object.assign(T,newTable(T.id,T.num,T.type,T.rate));T.name=keep.name;
  save();toast(t('tb.paid',{x:cop(c.total)}));render();
}

var CAM={},camSel=null,camDevs=[],camDevId='',camDrag=null;
function camNewVideo(){var v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.autoplay=true;return v}
function camRemove(tid,quiet){
  var c=CAM[tid];if(!c)return;
  clearInterval(c.timer);cancelAnimationFrame(c.raf);
  if(c.stream)c.stream.getTracks().forEach(function(x){x.stop()});
  if(c.url)URL.revokeObjectURL(c.url);
  try{c.video.pause();c.video.srcObject=null;c.video.removeAttribute('src');c.video.remove()}catch(e){}
  if(c.rc)c.rc.remove();
  delete CAM[tid];if(!quiet)render();
}
function camFile(file){
  if(!file||!camSel)return;
  camRemove(camSel,true);
  var v=camNewVideo(),c={mode:'file',url:URL.createObjectURL(file),video:v,zoom:1,px:0,py:0,speed:1,replay:false};
  v.loop=true;v.src=c.url;CAM[camSel]=c;v.play().catch(function(){});render();
}
function camLive(){
  if(!camSel)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(t('cm.blocked'));return}
  var con={video:camDevId?{deviceId:{exact:camDevId}}:{width:{ideal:1280}},audio:false},tid=camSel;
  navigator.mediaDevices.getUserMedia(con).then(function(stream){
    camRemove(tid,true);
    var v=camNewVideo();v.srcObject=stream;
    var c={mode:'live',stream:stream,video:v,rc:document.createElement('canvas'),cap:document.createElement('canvas'),buf:[],zoom:1,px:0,py:0,speed:1,replay:false};
    c.timer=setInterval(function(){camCapture(c)},66);
    CAM[tid]=c;v.play().catch(function(){});
    navigator.mediaDevices.enumerateDevices().then(function(ds){camDevs=ds.filter(function(x){return x.kind==='videoinput'});render()}).catch(function(){});
    render();
  }).catch(function(){toast(t('cm.blocked'))});
}
function camCapture(c){
  var v=c.video;if(v.readyState<2||!v.videoWidth||c.busy)return;
  var w=Math.min(640,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth),cv=c.cap;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  cv.getContext('2d').drawImage(v,0,0,w,h);c.busy=true;
  cv.toBlob(function(b){c.busy=false;if(!b)return;var n=Date.now();c.buf.push({t:n,b:b});while(c.buf.length&&c.buf[0].t<n-30500)c.buf.shift()},'image/jpeg',.6);
}
function camBmp(c,i){
  var b=c.cache[i];if(b&&b!==1)return b;
  if(!b&&c.frames[i]){c.cache[i]=1;createImageBitmap(c.frames[i].b).then(function(bm){c.cache[i]=bm;Object.keys(c.cache).forEach(function(k){if(+k<i-6&&c.cache[k]&&c.cache[k]!==1){c.cache[k].close();delete c.cache[k]}})}).catch(function(){})}
  return null;
}
function camDraw(c){
  var F=c.frames,tg=F[0].t+c.pos*1000,i=0;
  for(var k=0;k<F.length;k++){if(F[k].t<=tg)i=k;else break}
  var j=Math.min(i+1,F.length-1),a=F[j].t>F[i].t?(tg-F[i].t)/(F[j].t-F[i].t):0;
  for(var p=1;p<=8;p++)camBmp(c,Math.min(F.length-1,i+p));
  var bi=camBmp(c,i);if(!bi)return;
  var cv=c.rc;if(cv.width!==bi.width||cv.height!==bi.height){cv.width=bi.width;cv.height=bi.height}
  var x=cv.getContext('2d');x.globalAlpha=1;x.drawImage(bi,0,0);
  if(c.speed<1&&a>.05){var bj=camBmp(c,j);if(bj){x.globalAlpha=a;x.drawImage(bj,0,0);x.globalAlpha=1}}
}
function camLoop(c){
  if(!c.replay||c.mode!=='live'||tab!=='camaras'||CAM[camSel]!==c)return;
  var now=performance.now();
  if(!c.paused)c.pos+=(now-c.last)*c.speed/1000;
  c.last=now;
  var span=(c.frames[c.frames.length-1].t-c.frames[0].t)/1000;
  if(c.pos>=span){c.pos=span;c.paused=true}
  camDraw(c);camUI();
  c.raf=requestAnimationFrame(function(){camLoop(c)});
}
function camReplay(){
  var c=CAM[camSel];if(!c)return;
  if(c.mode==='file'){
    var v=c.video,dur=v.duration||0;if(!isFinite(dur)||dur<=0){toast(t('cm.nobuf'));return}
    v.loop=false;c.rs=Math.max(0,dur-30);v.currentTime=c.rs;v.playbackRate=c.speed;v.play().catch(function(){});c.replay=true;
  }else{
    if(c.buf.length<4){toast(t('cm.nobuf'));return}
    c.frames=c.buf.slice();c.cache={};c.pos=0;c.paused=false;c.last=performance.now();c.replay=true;
  }
  render();
}
function camBack(){
  var c=CAM[camSel];if(!c)return;

}
function camSpeed(s){

function camPP(){

  else{var span=(c.frames[c.frames.length-1].t-c.frames[0].t)/1000;if(c.pos>=span)c.pos=0;c.paused=!c.paused;c.last=performance.now()}
  camUI();
}
function camScrub(p){
  var c=CAM[camSel];if(!c||!c.replay)return;
  if(c.mode==='file'){var v=c.video,dur=v.duration||0;v.currentTime=c.rs+p*(dur-c.rs)}
  else{c.pos=p*(c.frames[c.frames.length-1].t-c.frames[0].t)/1000;camDraw(c)}
}
function camUI(){
  var c=CAM[camSel],s=$('#scrub');if(!c||!s||!c.replay||document.activeElement===s)return;
  var p=0;
  if(c.mode==='file'){var dur=c.video.duration||0;p=dur>c.rs?(c.video.currentTime-c.rs)/(dur-c.rs):0}
  else{var span=(c.frames[c.frames.length-1].t-c.frames[0].t)/1000;p=span?c.pos/span:0}
  s.value=Math.round(Math.max(0,Math.min(1,p))*1000);
  var pp=$('#campp');if(pp){var playing=c.mode==='file'?!c.video.paused&&!c.video.ended:!c.paused;pp.textContent=playing?t('cm.stop'):t('cm.play')}
}
function camApply(c){
  var z=$('#zin'),w=$('#zwrap');if(!z||!w||!c)return;

function camMount(){
  var c=CAM[camSel],z=$('#zin');if(!c||!z)return;

  var rp=c.replay&&c.mode==='live';c.video.style.display=rp?'none':'block';if(c.rc)c.rc.style.display=rp?'block':'none';

function ticketLines(){

function ticketText(){

    if(o.k==='c'||o.k==='title'){var s=o.x;return ' '.repeat(Math.max(0,Math.floor((W-s.length)/2)))+s}

function ticketPNG(cb){
  var L=ticketLines(),W=620,P=30,cv=document.createElement('canvas'),x=cv.getContext('2d'),H=P,mono='"Courier New",ui-monospace,Menlo,Consolas,monospace';
  L.forEach(function(o){H+=o.k==='title'?58:o.k==='sep'?22:o.k==='sub'?26:32});H+=P;
  cv.width=W;cv.height=H;x.fillStyle='#fbfaf5';x.fillRect(0,0,W,H);x.fillStyle='#16181d';
  var y=P;
  function fit(s,max){while(s.length>1&&x.measureText(s).width>max)s=s.slice(0,-2)+'…';return s}
  L.forEach(function(o){
    if(o.k==='title'){x.font='800 38px '+mono;x.textAlign='center';x.fillText(o.x,W/2,y+38);y+=58}
    else if(o.k==='sep'){x.strokeStyle='#8a8d96';x.setLineDash([6,5]);x.beginPath();x.moveTo(P,y+10);x.lineTo(W-P,y+10);x.stroke();y+=22}
    else if(o.k==='c'){x.font='20px '+mono;x.textAlign='center';x.fillText(fit(o.x,W-2*P),W/2,y+22);y+=32}
    else if(o.k==='h'){x.font='700 21px '+mono;x.textAlign='left';x.fillText(o.x,P,y+22);y+=32}
    else if(o.k==='sub'){x.font='17px '+mono;x.fillStyle='#5b5f69';x.textAlign='left';x.fillText(fit(o.x,W-2*P-20),P+20,y+18);x.fillStyle='#16181d';y+=26}
    else{x.font=(o.b?'700 ':'')+'21px '+mono;x.textAlign='right';x.fillText(o.r,W-P,y+22);var rw=x.measureText(o.r).width;x.textAlign='left';x.fillText(fit(o.l,W-2*P-rw-14),P,y+22);y+=32}
  });
  cv.toBlob(cb,'image/png');
}
function saveFile(name,data){

var STATIONS=['https://stream.zeno.fm/mvmkd6cprwzuv','https://stream.zeno.fm/uodjqojsnokvv','https://stream.zeno.fm/zndzohxgavluv'];
var radio={open:false,i:0,vol:.7,state:'idle',audio:null};
function radioAudio(){
  if(radio.audio)return radio.audio;
  var a=new Audio();a.preload='none';a.volume=radio.vol;
  a.addEventListener('playing',function(){radio.state='playing';radioUI()});
  a.addEventListener('pause',function(){if(radio.state!=='error'&&radio.state!=='loading')radio.state='idle';radioUI()});
  a.addEventListener('waiting',function(){if(radio.state==='playing'){radio.state='loading';radioUI()}});
  a.addEventListener('error',function(){radio.state='error';radioUI()});
  radio.audio=a;return a;
}
function radioPlay(){
  var a=radioAudio();
  if(radio.state==='playing'||radio.state==='loading'){a.pause();radio.state='idle';radioUI();return}
  radio.state='loading';radioUI();
  if(a.src!==STATIONS[radio.i])a.src=STATIONS[radio.i];
  var p=a.play();if(p&&p.catch)p.catch(function(){radio.state='error';radioUI()});
}
function radioStation(i){
  var was=radio.state==='playing'||radio.state==='loading';
  radio.i=i;radio.state='idle';if(radio.audio){radio.audio.pause();radio.audio.removeAttribute('src');radio.audio.load()}
  if(was)radioPlay();else radioUI();
}
function radioUI(){
  var el=$('#radio');if(!el)return;
  var on=radio.state==='playing'||radio.state==='loading';
  var head='<button class="btn sm'+(on?' on':'')+'" data-act="rd-open" aria-expanded="'+radio.open+'">♪ '+t('rd.title')+(on?' · '+t('rd.st',{n:radio.i+1}):'')+'</button>';
  var body='';
  if(radio.open){
    body='<div class="radio-p"><div class="chips">'+STATIONS.map(function(s,i){return '<button class="chip'+(i===radio.i?' on':'')+'" data-act="rd-st" data-i="'+i+'">'+t('rd.st',{n:i+1})+'</button>'}).join('')+'</div>'+
     '<div class="subctl" style="margin-top:10px"><button class="btn pri sm" data-act="rd-play">'+(on?t('cm.stop'):t('cm.play'))+'</button><span class="mut" style="font-size:12px">'+(radio.state==='loading'?t('rd.load'):radio.state==='playing'?t('cm.stlive'):'')+'</span></div>'+
     '<label class="f" style="margin-top:10px">'+t('rd.vol')+'<input type="range" min="0" max="1" step="0.05" value="'+radio.vol+'" data-bind="rd:vol"></label>'+
     (radio.state==='error'?'<p class="hint" style="margin:10px 0 6px;color:var(--warn)">'+t('rd.err')+'</p><a class="btn sm" href="'+STATIONS[radio.i]+'" target="_blank" rel="noopener">'+t('rd.open')+'</a>':'')+'</div>';
  }
  el.innerHTML=body+head;
}

      save();return;
    case 'th':S.theme[p[1]]=v;save();repaintBoard();return;
    case 'pl':var k=+p[2];M.players[k].color=v;S.roster[k].color=v;save();repaintBoard();return;
    case 't':
      var T=getT(selT);
      if(p[1]==='discount')T.discount=+v||0;else if(p[1]==='received')T.received=v;
      save();refreshTotals();return;
    case 'pr':var pr=S.products.find(function(q){return q.id===p[2]});if(pr){pr.price=Math.max(0,+v||0);save()}return;
    case 'ad':if(p[1]==='rate'){var T2=getT(p[2]);if(T2){T2.rate=Math.max(0,+v||0);save()}}return;
    case 'set':if(p[1]==='round'){S.round=Math.max(1,+v||100);save()}else if(p[1]==='wa'){S.wa=v.replace(/\D/g,'');save()}return;
    case 'rd':radio.vol=+v;if(radio.audio)radio.audio.volume=radio.vol;return;
    case 'cm':
      var c=CAM[camSel];
      if(p[1]==='zoom'&&c){c.zoom=+v;camApply(c)}
      else if(p[1]==='scrub')camScrub((+v)/1000);
      return;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='lang'){setLang(el.value);return}
  if(el.id==='camfile'){camFile(el.files&&el.files[0]);return}
  var b=el.dataset&&el.dataset.bind;if(!b)return;
  var p=b.split(':'),v=el.value;
  switch(p[0]){
    case 'su':
      var i=+p[2];
      if(p[1]==='photo'||p[1]==='emblem'){var f=el.files&&el.files[0];if(f)imgToData(f,p[1]==='emblem',function(d){S.roster[i][p[1]]=d;save();render()});return}
      if(p[1]==='mode')M.mode=v;else if(p[1]==='table')M.table=v;else if(p[1]==='auto')M.autoTurn=el.checked;else if(p[1]==='rst')M.resetPt=el.checked;
      save();return;
    case 'pcat':pcat=v;$('#ptbody').innerHTML=prodRows();return;
    case 'plow':plow=el.checked;$('#ptbody').innerHTML=prodRows();return;
    case 't':var T=getT(selT);if(p[1]==='method'){T.method=v;save();render()}return;
    case 'ad':
      var T2=getT(p[2]);if(!T2)return;
      if(p[1]==='name'){T2.name=v.trim();}else if(p[1]==='type'){T2.type=v}
      save();return;
    case 'set':
      if(p[1]==='lang'){setLang(v);return}
      if(p[1]==='cur'){S.currency=v;save();render()}
      return;
    case 'cm':if(p[1]==='dev')camDevId=v;return;
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='pinform'){e.preventDefault();if($('#pin').value==='6538'){adminOK=true;render()}else{toast(t('ad.wrong'));$('#pin').value=''}return}
  if(e.target.id!=='pform')return;e.preventDefault();
  var g=function(k){return $('#'+k).value},tr=$('#pf-track').checked;
  var rec={name:g('pf-name').trim(),cat:g('pf-cat').trim()||'—',price:Math.max(0,+g('pf-price')||0),cost:Math.max(0,+g('pf-cost')||0),stock:tr?Math.max(0,parseInt(g('pf-stock'),10)||0):0,min:tr?Math.max(0,parseInt(g('pf-min'),10)||0):0,track:tr};
  if(!rec.name){toast(t('pr.enter'));return}
  if(editP){Object.assign(S.products.find(function(q){return q.id===editP}),rec);toast(t('pr.updated'));editP=null}
  else{rec.id='p'+uid();rec.active=true;S.products.push(rec);toast(t('pr.added'))}
  save();render();
});
document.addEventListener('keydown',function(e){
  var tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Escape'){if(!$('#ticket').hidden){hideTicket();return}if(!$('#trophy').hidden){hideTrophy();return}if(live){live=false;renderBoardArea()}return}
  if(tg==='BUTTON')return;
  if(tab!=='marcador'||M.phase==='setup')return;
  var k=e.key.toLowerCase();
  if(k==='+'||k==='enter'||k==='arrowup'){e.preventDefault();mAdd()}
  else if(k===' '){e.preventDefault();mTurn()}
  else if(k==='z'||k==='backspace'){e.preventDefault();mUndo()}
  else if(k==='f'){live=!live;renderBoardArea()}
});

/* zoom y desplazamiento de la cámara */
document.addEventListener('pointerdown',function(e){var w=e.target.closest&&e.target.closest('#zwrap');var c=CAM[camSel];if(!w||!c)return;camDrag={x:e.clientX,y:e.clientY,px:c.px,py:c.py}});
document.addEventListener('pointermove',function(e){if(!camDrag)return;var c=CAM[camSel];if(!c){camDrag=null;return}c.px=camDrag.px+e.clientX-camDrag.x;c.py=camDrag.py+e.clientY-camDrag.y;camApply(c)});
document.addEventListener('pointerup',function(){camDrag=null});
document.addEventListener('wheel',function(e){var w=e.target.closest&&e.target.closest('#zwrap');var c=CAM[camSel];if(!w||!c)return;e.preventDefault();c.zoom=Math.max(1,Math.min(5,c.zoom*(e.deltaY<0?1.12:1/1.12)));camApply(c);var zs=$('[data-bind="cm:zoom"]');if(zs)zs.value=c.zoom},{passive:false});

document.documentElement.lang=lang;
radioUI();
setInterval(tick,200);
route();
})();
</script>

</html>
